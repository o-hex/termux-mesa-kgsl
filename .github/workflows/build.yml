name: Build Termux Mesa KGSL

on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  TERMUX_PACKAGES_REF: 6c15200c8281bd911df95be359cd91a4542c8346
  MESA_VERSION: "26.3.1"
  MESA_SHA256: "4e4e438eac7b840a9383988cbb7c08dad8041da544b9319fc26d319fa7348961"

jobs:
  patch-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: ${{ env.TERMUX_PACKAGES_REF }}
          path: termux-packages
          sparse-checkout: packages/mesa

      - name: Verify patches apply cleanly to mesa-${{ env.MESA_VERSION }}
        run: |
          set -euo pipefail
          grep -q "TERMUX_PKG_VERSION=\"$MESA_VERSION\"" termux-packages/packages/mesa/build.sh
          curl -fsSL -o mesa.tar.xz "https://archive.mesa3d.org/mesa-${MESA_VERSION}.tar.xz"
          echo "${MESA_SHA256}  mesa.tar.xz" | sha256sum -c
          tar xf mesa.tar.xz
          rm -f termux-packages/packages/mesa/0017-preserve-egl-support-in-zink.patch
          cp patches/*.patch termux-packages/packages/mesa/
          cd "mesa-${MESA_VERSION}"
          for p in ../termux-packages/packages/mesa/*.patch; do
            echo "== Applying $(basename "$p")"
            sed 's|@TERMUX_PREFIX@|/data/data/com.termux/files/usr|g' "$p" | patch -p1 --no-backup-if-mismatch --batch
          done

  build:
    needs: patch-check
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: ${{ env.TERMUX_PACKAGES_REF }}
          path: termux-packages

      - name: Configure mesa package with Freedreno KGSL
        run: |
          set -euo pipefail
          rm -f termux-packages/packages/mesa/0017-preserve-egl-support-in-zink.patch
          cp patches/*.patch termux-packages/packages/mesa/
          sed -i 's|-Dgallium-drivers=llvmpipe,softpipe,virgl,zink|-Dgallium-drivers=freedreno,llvmpipe,softpipe,virgl,zink|' \
            termux-packages/packages/mesa/build.sh
          grep -n "gallium-drivers" termux-packages/packages/mesa/build.sh
          ls -la termux-packages/packages/mesa/

      - name: Load Termux docker image
        working-directory: termux-packages
        run: ./scripts/run-docker.sh true

      - name: Free disk space
        working-directory: termux-packages
        env:
          CI: "true"
        run: ./scripts/free-space.sh

      - name: Build mesa (aarch64)
        working-directory: termux-packages
        env:
          CI: "true"
        run: ./scripts/run-docker.sh ./build-package.sh -I -a aarch64 mesa

      - name: Verify kgsl_dri.so in built package and collect debs
        run: |
          set -euo pipefail
          mkdir -p dist
          cp termux-packages/output/*mesa*.deb dist/
          ls -lh dist/
          dpkg-deb -c dist/mesa_${MESA_VERSION}_aarch64.deb | grep -E "dri/|libgallium|libEGL|libGLX"

      - uses: actions/upload-artifact@v4
        with:
          name: mesa-kgsl-${{ env.MESA_VERSION }}-aarch64
          path: dist/*.deb
          if-no-files-found: error
